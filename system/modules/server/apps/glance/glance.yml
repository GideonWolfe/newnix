# Save to reload the configuration, then refresh the browser.
# Restore registry/Stylix references when converting to Nix.
server:
  host: 0.0.0.0
  port: 8080
  assets-path: /app/config/assets

branding:
  app-name: Dashboard
  logo-text: GW
  app-background-color: "#1e1e2e"

theme:
  light: false
  disable-picker: true
  background-color: 240 21 15
  primary-color: 217 92 76
  positive-color: 115 54 76
  negative-color: 343 81 75
  contrast-multiplier: 1.0
  custom-css-file: /assets/stylix.css

pages:
  - name: Home
    width: wide
    head-widgets:
      -
        $include: widgets/gatus-monitor.yml
    columns:
      - size: small
        widgets:
          - type: bookmarks
            title: Web
            groups:
              - title: Everyday
                links:
                  - title: YouTube
                    url: https://youtube.com/
                    icon: si:youtube
                  - title: Reddit
                    url: https://reddit.com/
                    icon: si:reddit
              - title: Development
                links:
                  - title: GitHub
                    url: https://github.com/
                    icon: si:github
                  - title: Forgejo
                    url: http://192.168.88.104:3030
                    icon: sh:forgejo
                  - title: NixOS Search
                    url: https://search.nixos.org/
                    icon: si:nixos

          - type: search
            search-engine: duckduckgo
            bangs:
              - title: Nix Search
                shortcut: "!n"
                url: https://nixsearch.thekoppe.com/?q={QUERY}

      - size: full
